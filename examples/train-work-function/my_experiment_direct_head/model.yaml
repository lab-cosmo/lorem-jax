model:
  lorem.LoremWF:
    # Phi from a mean-pooled readout of the invariant node features, the way
    # CP-MACE predicts the Fermi level.
    work_function_from_energy: false
    # null: take the offset prepare.py fitted from the training labels, so it
    # is never typed by hand. train.py resolves it and the resolved value is
    # what the checkpoint records.
    work_function_offset: null
    cutoff: 5.0
    max_degree: 2
    max_degree_lr: 0
    num_features: 32
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 4
    lr: false
