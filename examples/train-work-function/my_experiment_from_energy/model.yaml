model:
  lorem.LoremWF:
    # Phi = dE/dq, off the same backward pass as the forces. Free, and
    # consistent with the model's own E(q) by construction.
    work_function_from_energy: true
    cutoff: 5.0
    max_degree: 2
    max_degree_lr: 0
    num_features: 32
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 4
    lr: false
