model:
  lorem.LoremQ:
    # Phi from a mean-pooled readout of the invariant node features, the way
    # CP-MACE predicts the Fermi level. The offset starts the head near the
    # training set's mean work function (printed by prepare.py) instead of at
    # zero, against labels spanning 2-7 V.
    work_function_head: direct
    work_function_offset: 4.91
    cutoff: 5.0
    max_degree: 2
    max_degree_lr: 0
    num_features: 32
    num_radial: 16
    num_message_passing: 1
    num_spherical_features: 4
    lr: false
